<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef3ea"/>
      <stop offset="100%" stop-color="#dde8d6"/>
    </linearGradient>
    <filter id="paint" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="art-4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="70" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g filter="url(#paint)"><ellipse cx="447" cy="466" rx="250" ry="124" transform="rotate(32 447 466)" fill="#4f7a3f" opacity="0.33"/><ellipse cx="486" cy="108" rx="260" ry="117" transform="rotate(-19 486 108)" fill="#93bb7b" opacity="0.6"/><ellipse cx="74" cy="453" rx="223" ry="203" transform="rotate(9 74 453)" fill="#2c4a24" opacity="0.54"/><ellipse cx="198" cy="531" rx="231" ry="216" transform="rotate(-31 198 531)" fill="#cfe3c1" opacity="0.49"/><ellipse cx="494" cy="152" rx="148" ry="106" transform="rotate(-15 494 152)" fill="#4f7a3f" opacity="0.39"/><ellipse cx="222" cy="389" rx="216" ry="165" transform="rotate(8 222 389)" fill="#93bb7b" opacity="0.49"/><ellipse cx="156" cy="67" rx="300" ry="234" transform="rotate(15 156 67)" fill="#2c4a24" opacity="0.28"/><line x1="77" y1="187" x2="1" y2="115" stroke="#2c4a24" stroke-width="18" stroke-linecap="round" opacity="0.22"/><line x1="143" y1="328" x2="2" y2="448" stroke="#cfe3c1" stroke-width="18" stroke-linecap="round" opacity="0.22"/><line x1="189" y1="565" x2="9" y2="576" stroke="#4f7a3f" stroke-width="10" stroke-linecap="round" opacity="0.22"/><line x1="248" y1="216" x2="460" y2="157" stroke="#93bb7b" stroke-width="6" stroke-linecap="round" opacity="0.22"/><line x1="376" y1="469" x2="303" y2="417" stroke="#2c4a24" stroke-width="17" stroke-linecap="round" opacity="0.22"/></g>
  <rect width="800" height="600" filter="url(#grain)" opacity="0.07"/>

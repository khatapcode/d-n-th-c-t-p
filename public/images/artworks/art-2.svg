<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f0f4"/>
      <stop offset="100%" stop-color="#d6e4ec"/>
    </linearGradient>
    <filter id="paint" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="art-2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="70" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g filter="url(#paint)"><ellipse cx="441" cy="457" rx="179" ry="115" transform="rotate(40 441 457)" fill="#2c5d7c" opacity="0.42"/><ellipse cx="699" cy="293" rx="166" ry="161" transform="rotate(-21 699 293)" fill="#6fa8c4" opacity="0.48"/><ellipse cx="137" cy="221" rx="227" ry="116" transform="rotate(-39 137 221)" fill="#173b52" opacity="0.56"/><ellipse cx="75" cy="172" rx="208" ry="196" transform="rotate(-18 75 172)" fill="#b7d6e4" opacity="0.51"/><ellipse cx="406" cy="78" rx="208" ry="216" transform="rotate(33 406 78)" fill="#2c5d7c" opacity="0.29"/><ellipse cx="435" cy="133" rx="224" ry="197" transform="rotate(28 435 133)" fill="#6fa8c4" opacity="0.42"/><ellipse cx="251" cy="151" rx="120" ry="188" transform="rotate(-7 251 151)" fill="#173b52" opacity="0.35"/><line x1="107" y1="13" x2="-42" y2="-2" stroke="#173b52" stroke-width="14" stroke-linecap="round" opacity="0.22"/><line x1="200" y1="7" x2="61" y2="93" stroke="#b7d6e4" stroke-width="26" stroke-linecap="round" opacity="0.22"/><line x1="469" y1="299" x2="428" y2="171" stroke="#2c5d7c" stroke-width="19" stroke-linecap="round" opacity="0.22"/><line x1="573" y1="376" x2="519" y2="530" stroke="#6fa8c4" stroke-width="16" stroke-linecap="round" opacity="0.22"/><line x1="348" y1="153" x2="552" y2="-19" stroke="#173b52" stroke-width="25" stroke-linecap="round" opacity="0.22"/></g>
  <rect width="800" height="600" filter="url(#grain)" opacity="0.07"/>

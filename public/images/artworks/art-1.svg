<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#eee4d2"/>
    </linearGradient>
    <filter id="paint" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="art-1" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="70" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g filter="url(#paint)"><ellipse cx="501" cy="436" rx="196" ry="179" transform="rotate(27 501 436)" fill="#b8863b" opacity="0.42"/><ellipse cx="546" cy="89" rx="179" ry="117" transform="rotate(11 546 89)" fill="#e3c07b" opacity="0.29"/><ellipse cx="581" cy="186" rx="259" ry="167" transform="rotate(20 581 186)" fill="#6e4a1e" opacity="0.57"/><ellipse cx="124" cy="353" rx="220" ry="170" transform="rotate(-20 124 353)" fill="#f3d9a4" opacity="0.56"/><ellipse cx="168" cy="299" rx="244" ry="234" transform="rotate(-30 168 299)" fill="#b8863b" opacity="0.49"/><ellipse cx="560" cy="442" rx="111" ry="134" transform="rotate(-11 560 442)" fill="#e3c07b" opacity="0.48"/><ellipse cx="82" cy="355" rx="286" ry="95" transform="rotate(24 82 355)" fill="#6e4a1e" opacity="0.36"/><line x1="187" y1="524" x2="170" y2="648" stroke="#6e4a1e" stroke-width="21" stroke-linecap="round" opacity="0.22"/><line x1="298" y1="42" x2="400" y2="-26" stroke="#f3d9a4" stroke-width="20" stroke-linecap="round" opacity="0.22"/><line x1="34" y1="1" x2="-6" y2="-110" stroke="#b8863b" stroke-width="6" stroke-linecap="round" opacity="0.22"/><line x1="68" y1="92" x2="-150" y2="189" stroke="#e3c07b" stroke-width="11" stroke-linecap="round" opacity="0.22"/><line x1="0" y1="587" x2="-40" y2="577" stroke="#6e4a1e" stroke-width="9" stroke-linecap="round" opacity="0.22"/></g>
  <rect width="800" height="600" filter="url(#grain)" opacity="0.07"/>
</svg>
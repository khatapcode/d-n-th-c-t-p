<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f1e9"/>
      <stop offset="100%" stop-color="#e8ddcd"/>
    </linearGradient>
    <filter id="paint" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="art-5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="70" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g filter="url(#paint)"><ellipse cx="363" cy="282" rx="206" ry="91" transform="rotate(-21 363 282)" fill="#8a6a4f" opacity="0.58"/><ellipse cx="207" cy="85" rx="248" ry="227" transform="rotate(-19 207 85)" fill="#c3a184" opacity="0.31"/><ellipse cx="259" cy="506" rx="179" ry="240" transform="rotate(-35 259 506)" fill="#4f3524" opacity="0.48"/><ellipse cx="556" cy="481" rx="139" ry="132" transform="rotate(-10 556 481)" fill="#e4d2bb" opacity="0.31"/><ellipse cx="316" cy="74" rx="120" ry="127" transform="rotate(-35 316 74)" fill="#8a6a4f" opacity="0.62"/><ellipse cx="185" cy="217" rx="202" ry="125" transform="rotate(14 185 217)" fill="#c3a184" opacity="0.32"/><ellipse cx="118" cy="275" rx="167" ry="239" transform="rotate(-7 118 275)" fill="#4f3524" opacity="0.36"/><line x1="715" y1="180" x2="785" y2="72" stroke="#4f3524" stroke-width="12" stroke-linecap="round" opacity="0.22"/><line x1="523" y1="593" x2="602" y2="770" stroke="#e4d2bb" stroke-width="8" stroke-linecap="round" opacity="0.22"/><line x1="31" y1="305" x2="-161" y2="474" stroke="#8a6a4f" stroke-width="9" stroke-linecap="round" opacity="0.22"/><line x1="74" y1="395" x2="23" y2="536" stroke="#c3a184" stroke-width="17" stroke-linecap="round" opacity="0.22"/><line x1="303" y1="331" x2="241" y2="222" stroke="#4f3524" stroke-width="18" stroke-linecap="round" opacity="0.22"/></g>
  <rect width="800" height="600" filter="url(#grain)" opacity="0.07"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#052e22"/>
      <stop offset="100%" stop-color="#0a4632"/>
    </linearGradient>
    <filter id="paint" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="hero" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="70" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g filter="url(#paint)"><ellipse cx="737" cy="265" rx="185" ry="119" transform="rotate(22 737 265)" fill="#12795a" opacity="0.34"/><ellipse cx="636" cy="231" rx="222" ry="203" transform="rotate(-30 636 231)" fill="#45bd88" opacity="0.44"/><ellipse cx="368" cy="531" rx="251" ry="200" transform="rotate(-24 368 531)" fill="#0b4d3a" opacity="0.35"/><ellipse cx="128" cy="89" rx="248" ry="135" transform="rotate(-5 128 89)" fill="#8fe0b8" opacity="0.45"/><ellipse cx="725" cy="443" rx="242" ry="209" transform="rotate(6 725 443)" fill="#12795a" opacity="0.56"/><ellipse cx="95" cy="496" rx="178" ry="159" transform="rotate(-35 95 496)" fill="#45bd88" opacity="0.43"/><ellipse cx="152" cy="440" rx="291" ry="209" transform="rotate(-32 152 440)" fill="#0b4d3a" opacity="0.63"/><line x1="85" y1="158" x2="74" y2="229" stroke="#0b4d3a" stroke-width="19" stroke-linecap="round" opacity="0.22"/><line x1="148" y1="81" x2="-59" y2="25" stroke="#8fe0b8" stroke-width="18" stroke-linecap="round" opacity="0.22"/><line x1="798" y1="112" x2="907" y2="46" stroke="#12795a" stroke-width="18" stroke-linecap="round" opacity="0.22"/><line x1="179" y1="199" x2="-38" y2="336" stroke="#45bd88" stroke-width="25" stroke-linecap="round" opacity="0.22"/><line x1="396" y1="60" x2="587" y2="190" stroke="#0b4d3a" stroke-width="7" stroke-linecap="round" opacity="0.22"/></g>
  <rect width="800" height="600" filter="url(#grain)" opacity="0.07"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6efe2"/>
      <stop offset="100%" stop-color="#efe2cf"/>
    </linearGradient>
    <filter id="paint" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="course-1" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="70" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g filter="url(#paint)"><ellipse cx="244" cy="63" rx="110" ry="212" transform="rotate(40 244 63)" fill="#c2703d" opacity="0.47"/><ellipse cx="536" cy="419" rx="263" ry="178" transform="rotate(9 536 419)" fill="#e0a45e" opacity="0.37"/><ellipse cx="514" cy="530" rx="294" ry="186" transform="rotate(39 514 530)" fill="#8c3f2b" opacity="0.45"/><ellipse cx="350" cy="424" rx="165" ry="228" transform="rotate(-30 350 424)" fill="#d9b382" opacity="0.3"/><ellipse cx="329" cy="283" rx="272" ry="134" transform="rotate(-37 329 283)" fill="#c2703d" opacity="0.6"/><ellipse cx="550" cy="369" rx="168" ry="187" transform="rotate(-15 550 369)" fill="#e0a45e" opacity="0.57"/><ellipse cx="411" cy="80" rx="185" ry="217" transform="rotate(24 411 80)" fill="#8c3f2b" opacity="0.32"/><line x1="397" y1="364" x2="475" y2="275" stroke="#8c3f2b" stroke-width="25" stroke-linecap="round" opacity="0.22"/><line x1="269" y1="559" x2="241" y2="620" stroke="#d9b382" stroke-width="17" stroke-linecap="round" opacity="0.22"/><line x1="478" y1="86" x2="692" y2="156" stroke="#c2703d" stroke-width="13" stroke-linecap="round" opacity="0.22"/><line x1="691" y1="435" x2="669" y2="282" stroke="#e0a45e" stroke-width="17" stroke-linecap="round" opacity="0.22"/><line x1="185" y1="142" x2="197" y2="297" stroke="#8c3f2b" stroke-width="22" stroke-linecap="round" opacity="0.22"/></g>
  <rect width="800" height="600" filter="url(#grain)" opacity="0.07"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2e8ea"/>
      <stop offset="100%" stop-color="#e6d5d9"/>
    </linearGradient>
    <filter id="paint" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="course-3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="70" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g filter="url(#paint)"><ellipse cx="493" cy="182" rx="152" ry="226" transform="rotate(3 493 182)" fill="#9b3f52" opacity="0.37"/><ellipse cx="118" cy="180" rx="248" ry="220" transform="rotate(18 118 180)" fill="#d8899a" opacity="0.39"/><ellipse cx="443" cy="379" rx="209" ry="222" transform="rotate(-38 443 379)" fill="#5f2433" opacity="0.43"/><ellipse cx="209" cy="65" rx="119" ry="157" transform="rotate(4 209 65)" fill="#ecc7c1" opacity="0.57"/><ellipse cx="162" cy="152" rx="206" ry="231" transform="rotate(-16 162 152)" fill="#9b3f52" opacity="0.56"/><ellipse cx="626" cy="384" rx="191" ry="196" transform="rotate(-36 626 384)" fill="#d8899a" opacity="0.46"/><ellipse cx="366" cy="342" rx="188" ry="239" transform="rotate(-17 366 342)" fill="#5f2433" opacity="0.28"/><line x1="352" y1="476" x2="195" y2="583" stroke="#5f2433" stroke-width="23" stroke-linecap="round" opacity="0.22"/><line x1="274" y1="225" x2="251" y2="311" stroke="#ecc7c1" stroke-width="11" stroke-linecap="round" opacity="0.22"/><line x1="608" y1="293" x2="538" y2="131" stroke="#9b3f52" stroke-width="15" stroke-linecap="round" opacity="0.22"/><line x1="207" y1="168" x2="356" y2="12" stroke="#d8899a" stroke-width="9" stroke-linecap="round" opacity="0.22"/><line x1="724" y1="356" x2="889" y2="247" stroke="#5f2433" stroke-width="19" stroke-linecap="round" opacity="0.22"/></g>
  <rect width="800" height="600" filter="url(#grain)" opacity="0.07"/>
</svg>
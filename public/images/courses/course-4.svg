<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ece9f2"/>
      <stop offset="100%" stop-color="#dcd6e8"/>
    </linearGradient>
    <filter id="paint" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="course-4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="70" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g filter="url(#paint)"><ellipse cx="634" cy="301" rx="158" ry="198" transform="rotate(12 634 301)" fill="#4b3f7a" opacity="0.39"/><ellipse cx="579" cy="420" rx="261" ry="168" transform="rotate(-34 579 420)" fill="#8f7fc4" opacity="0.6"/><ellipse cx="349" cy="257" rx="124" ry="98" transform="rotate(17 349 257)" fill="#2b2350" opacity="0.53"/><ellipse cx="657" cy="449" rx="177" ry="180" transform="rotate(26 657 449)" fill="#c8bde8" opacity="0.51"/><ellipse cx="399" cy="183" rx="163" ry="224" transform="rotate(-37 399 183)" fill="#4b3f7a" opacity="0.51"/><ellipse cx="182" cy="71" rx="137" ry="219" transform="rotate(-8 182 71)" fill="#8f7fc4" opacity="0.35"/><ellipse cx="297" cy="334" rx="233" ry="193" transform="rotate(-39 297 334)" fill="#2b2350" opacity="0.53"/><line x1="371" y1="338" x2="538" y2="209" stroke="#2b2350" stroke-width="22" stroke-linecap="round" opacity="0.22"/><line x1="15" y1="3" x2="56" y2="27" stroke="#c8bde8" stroke-width="9" stroke-linecap="round" opacity="0.22"/><line x1="584" y1="23" x2="762" y2="90" stroke="#4b3f7a" stroke-width="8" stroke-linecap="round" opacity="0.22"/><line x1="269" y1="121" x2="457" y2="16" stroke="#8f7fc4" stroke-width="15" stroke-linecap="round" opacity="0.22"/><line x1="314" y1="425" x2="407" y2="458" stroke="#2b2350" stroke-width="23" stroke-linecap="round" opacity="0.22"/></g>
  <rect width="800" height="600" filter="url(#grain)" opacity="0.07"/>
</svg>
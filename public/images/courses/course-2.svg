<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf2ee"/>
      <stop offset="100%" stop-color="#d8e7e0"/>
    </linearGradient>
    <filter id="paint" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="course-2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="70" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g filter="url(#paint)"><ellipse cx="241" cy="321" rx="183" ry="225" transform="rotate(-13 241 321)" fill="#2f6b58" opacity="0.35"/><ellipse cx="682" cy="303" rx="249" ry="232" transform="rotate(33 682 303)" fill="#7fb8a4" opacity="0.3"/><ellipse cx="324" cy="412" rx="294" ry="102" transform="rotate(-13 324 412)" fill="#1d4a3c" opacity="0.56"/><ellipse cx="224" cy="169" rx="281" ry="202" transform="rotate(-18 224 169)" fill="#bcd9cc" opacity="0.57"/><ellipse cx="653" cy="514" rx="264" ry="212" transform="rotate(26 653 514)" fill="#2f6b58" opacity="0.33"/><ellipse cx="525" cy="320" rx="250" ry="189" transform="rotate(-38 525 320)" fill="#7fb8a4" opacity="0.41"/><ellipse cx="655" cy="194" rx="114" ry="232" transform="rotate(-2 655 194)" fill="#1d4a3c" opacity="0.41"/><line x1="382" y1="472" x2="585" y2="634" stroke="#1d4a3c" stroke-width="14" stroke-linecap="round" opacity="0.22"/><line x1="589" y1="494" x2="413" y2="611" stroke="#bcd9cc" stroke-width="17" stroke-linecap="round" opacity="0.22"/><line x1="146" y1="135" x2="333" y2="285" stroke="#2f6b58" stroke-width="20" stroke-linecap="round" opacity="0.22"/><line x1="368" y1="389" x2="343" y2="336" stroke="#7fb8a4" stroke-width="20" stroke-linecap="round" opacity="0.22"/><line x1="705" y1="572" x2="861" y2="432" stroke="#1d4a3c" stroke-width="22" stroke-linecap="round" opacity="0.22"/></g>
  <rect width="800" height="600" filter="url(#grain)" opacity="0.07"/>
</svg>